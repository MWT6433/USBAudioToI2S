<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <!-- 丝印正稿：透明底，单色线条。改根 g 的 color 即可换丝印颜色（白/黑）。
       构图：两个错叠的 ⌜ 折线暗示两层正方形芯片（Win11 复制图标语言，右后层的竖线被中央符号断开），
       中央为 Cirrus Logic 官方条带图形符号（仅 mark 部分，源自 Wikimedia Commons 公版 path），
       左上角三条 WiFi 式声波弧，底部 ULTRA DUAL。
       印刷宽度换算（viewBox 400 宽）：印 10mm 时线条宽 0.175mm、最小净隙约 0.15mm，满足常规丝印工艺。 -->
  <rect width="400" height="300" rx="20" fill="#141E33"/>
  <g color="#FFFFFF">
    <!-- 左上角三条声波弧（圆心即前层方框左上角，向左上辐射） -->
    <g fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round">
      <path d="M 124 80 A 24 24 0 0 1 148 56"/>
      <path d="M 108 80 A 40 40 0 0 1 148 40"/>
      <path d="M 92 80 A 56 56 0 0 1 148 24"/>
    </g>

    <!-- 后层芯片（右下错位）：顶边完整，左边被中央符号断开 -->
    <g fill="none" stroke="currentColor" stroke-width="7">
      <path d="M 168 110 V 100 H 308"/>
      <path d="M 168 190 V 240"/>
    </g>

    <!-- 前层芯片：左上角 ⌜，暗示正方形 -->
    <path d="M 148 220 V 80 H 288" fill="none" stroke="currentColor" stroke-width="7"/>

    <!-- Cirrus Logic 官方条带图形符号（仅 mark，无字标） -->
    <g transform="translate(160 116) scale(1.0211)" fill="currentColor">
      <path d="M113.3 27.9H50.8c-.2 1.2-.3 2.4-.4 3.7H23.6c0 .6 0 3 0 3.6H0c.1 1.1.2 2.2.3 3.3h112.9c.3-1.7.4-3.5.4-5.3.1-1.8-.1-3.6-.3-5.3M52.6 45.5H25.8c.5 1.3 1 2.5 1.6 3.7H3.8c.6 1.2 1.3 2.3 2 3.3h96.8l9.9-10.6h-61c.3 1.2.7 2.4 1.1 3.6M62.6 59.5H35.8c1.7 1.4 3.6 2.6 5.6 3.6H17.8c4.2 2.1 8.9 3.3 13.8 3.3 0 0 .1 0 .1 0h57.9l10-10.6H58.8c1.2 1.3 2.5 2.6 3.8 3.7"/>
      <path d="M105.2 10.6C99.4 4.1 91.2 0 82 0c-5.2 0-10.1 1.3-14.4 3.6H40.8c-1.9 1-3.7 2.3-5.4 3.6H11.8c-1.2 1-2.3 2.1-3.4 3.3h96.8zM112.6 24.6c-1-3.9-2.6-7.5-4.8-10.6H56.2c-.8 1.2-1.5 2.4-2.2 3.7H27.3c-.6 1.2-1.1 2.4-1.6 3.7H2.1c-.4 1.1-.7 2.2-1 3.3h111.5z"/>
    </g>

    <!-- 产品名 -->
    <text x="204" y="278" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-size="27" font-weight="600" letter-spacing="8" fill="currentColor">ULTRA DUAL</text>
  </g>
</svg>
